# Breeds — constrained visual flavors of BDMinoRace. The breed's
# RNAM stays BDMinoRace; the per-breed headpart_probability rules
# below narrow which headparts and tints the furrifier picks for an
# NPC assigned to the breed. See PLAN_FURRIFIER_BREEDS.md.
breeds = [
  # We want all Minotaurs to be one of these breeds, which we do by ensuring probabilities
  # add to 100%. If we set a breed's probability to 0, it would only be assigned through
  # explict assignment by faction, leveled NPC group, or individual NPC.
  {breed = "CapeBuffalo", race = "BDMinoRace", probability = 0.2},
  {breed = "Sanga", race = "BDMinoRace", probability = 0.25},
  {breed = "LongHorn", race = "BDMinoRace", probability = 0.2},
  {breed = "Ankole", race = "BDMinoRace", probability = 0.1},
  {breed = "Bison", race = "BDMinoRace", probability = 0.25},
]

# Color schemes
# tint_layer_mask = [[color_name, weight], ...]
# tint_layer_mask matches the mask filename--e.g. "TintMuzzle" for BDMinoFaceTintMuzzleMask.dds.
# If color_name = probability, the value is the probability of applying that tint at all
# Otherwise, color_name must be a valid color for that tint layer.
[color_schemes.CapeBuffalo]
SkinTone = [["BDMinoCoatBlack", 1.0], ["BDMinoCoatDarkBrown", 1.0], ["BDMinoCoatWarmGray", 1.0]]
TintMuzzle = [["probability", 0.5], ["BDMinoFaceFurBlack", 1.0], ["BDMinoFaceFurBlackBrown", 1.0], ["BDMinoFaceFurBrownDark", 1.0]]
TintEyeUpper = [["probability", 0.75], ["BDMinoFaceFurBlack", 0.8], ["BDMinoFaceFurTan", 0.2], ["BDMinoFaceFurWhite", 0.15]]
TintEyeLower = [["probability", 0.75], ["BDMinoFaceFurBlack", 0.8], ["BDMinoFaceFurTan", 0.2], ["BDMinoFaceFurWhite", 0.15]]
TintCheekLower = [["probability", 0.75], ["BDMinoFaceFurBlack", 0.8], ["BDMinoFaceFurTan", 0.2], ["BDMinoFaceFurWhite", 0.15]]
TintCheekUpper = [["probability", 0.75], ["BDMinoFaceFurBlack", 0.8], ["BDMinoFaceFurTan", 0.2], ["BDMinoFaceFurWhite", 0.15]]

[color_schemes.Ankole]
SkinTone = [["BDMinoCoatBay", 1.0], ["BDMinoCoatBayLight", 1.0], ["BDMinoCoatBrown", 1.0]]
TintMuzzle = [["BDMinoFaceFurTan", 0.5], ["BDMinoFaceFurWhite", 0.5], ["BDMinoFaceFurWhite", 0.3]]
TintEyeUpper = [["probability", 0.75], ["BDMinoFaceFurTan", 0.8], ["BDMinoFaceFurTan", 0.6], ["BDMinoFaceFurWhite", 0.6], ["BDMinoFaceFurWhite", 0.45]]
TintEyeLower = [["probability", 0.75], ["BDMinoFaceFurTan", 0.8], ["BDMinoFaceFurTan", 0.6], ["BDMinoFaceFurWhite", 0.6], ["BDMinoFaceFurWhite", 0.45]]
TintCheekLower = [["probability", 0.75], ["BDMinoFaceFurTan", 0.8], ["BDMinoFaceFurTan", 0.6], ["BDMinoFaceFurWhite", 0.6], ["BDMinoFaceFurWhite", 0.45]]
TintCheekUpper = [["probability", 0.75], ["BDMinoFaceFurTan", 0.8], ["BDMinoFaceFurTan", 0.6], ["BDMinoFaceFurWhite", 0.6], ["BDMinoFaceFurWhite", 0.45]]
TintNeck = [["probability", 0.5], ["BDMinoFaceFurWhite", 0.7], ["BDMinoFaceFurWhite", 0.5], ["BDMinoFaceFurWhite", 0.3]]
TintNose = [["BDMinoFleshTan", 0.7]]

[color_schemes.Cattle]
SkinTone = [["BDMinoCoatBay"], ["BDMinoCoatBayLight"], ["BDMinoCoatBrown"], ["BDMinoCoatDarkBrown"], ["BDMinoCoatBlack"], ["BDMinoCoatWarmGray"], ["BDMinoCoatTan"], ["White"]]
TintMuzzle = [["probability", 0.4], ["BDMinoFaceFurWhite", 0.7], ["BDMinoFaceFurWhite", 0.5], ["BDMinoFaceFurWhite", 0.3]]
TintEyeUpper = [["probability", 0.5], ["BDMinoFaceFurBlack", 0.5], ["BDMinoFaceFurBrownDark", 0.5], ["BDMinoFaceFurTan", 0.5], ["BDMinoFaceFurWhite", 0.5]]
TintEyeLower = [["probability", 0.5], ["BDMinoFaceFurBlack", 0.5], ["BDMinoFaceFurBrownDark", 0.5], ["BDMinoFaceFurTan", 0.5], ["BDMinoFaceFurWhite", 0.5]]
TintCheekLower = [["probability", 0.5], ["BDMinoFaceFurBlack", 0.5], ["BDMinoFaceFurBrownDark", 0.5], ["BDMinoFaceFurTan", 0.5], ["BDMinoFaceFurWhite", 0.5]]
TintMuzzleUpper = [["probability", 0.5], ["BDMinoFaceFurBlack", 0.25], ["BDMinoFaceFurBrownDark", 0.25], ["BDMinoFaceFurTan", 0.25], ["BDMinoFaceFurWhite", 0.25]]
TintNose = [["BDMinoFleshTan", 0.7], ["BDMinoFleshTan", 0.4], ["BDMinoFleshDark", 0.7], ["BDMinoFleshDark", 0.4]]

[color_schemes.Bison]
SkinTone = [["BDMinoCoatDarkBrown", 1.0], ["BDMinoCoatWarmGray", 1.0]]
TintMuzzle = [["probability", 0.4], ["BDMinoFaceFurBlack", 1.0], ["BDMinoFaceFurBlackBrown", 1.0], ["BDMinoFaceFurBrownDark", 1.0]]
TintEyeUpper = [["probability", 0.75], ["BDMinoFaceFurBlack", 0.8], ["BDMinoFaceFurTan", 0.2], ["BDMinoFaceFurWhite", 0.15]]
TintEyeLower = [["probability", 0.75], ["BDMinoFaceFurBlack", 0.8], ["BDMinoFaceFurTan", 0.2], ["BDMinoFaceFurWhite", 0.15]]
TintCheekLower = [["probability", 0.75], ["BDMinoFaceFurBlack", 0.8], ["BDMinoFaceFurTan", 0.2], ["BDMinoFaceFurWhite", 0.15]]
TintCheekUpper = [["probability", 0.75], ["BDMinoFaceFurBlack", 0.8], ["BDMinoFaceFurTan", 0.2], ["BDMinoFaceFurWhite", 0.15]]


# CapeBuffalo: cape horns only, no facial fluff, dark coat tones.
[[headpart_probability]]
race = "CapeBuffalo"
sex = "both"
EYEBROWS = {headpart = ["BDMinoCapeHorns"]}
FACIAL_HAIR = 0.0
colors = "CapeBuffalo" # applies the color scheme of the same name, defined above

